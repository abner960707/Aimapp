        let map;

        const defaultCenter = [22.6273, 120.3014]; // 高雄市中心
        const defaultZoom = 13;

        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView(defaultCenter, defaultZoom);

            // Add Custom Zoom Control to top-right
            L.control.zoom({
                position: 'top-right'
            }).addTo(map);

            // Light Tile Layer (CartoDB Positron)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            markersLayer.addTo(map);
            populateDistrictFilter();
            renderCameras(speedCamerasData);
        }

        function populateDistrictFilter() {
            const districtSelect = document.getElementById('district-filter');
            const districts = [...new Set(speedCamerasData.map(item => item.district))].sort();
            
            districts.forEach(district => {
                const option = document.createElement('option');
                option.value = district;
                option.textContent = district;
                districtSelect.appendChild(option);
            });
        }

        function createCameraIcon(limit) {
            let bgColor = 'bg-red-600';
            if (limit <= 40) bgColor = 'bg-amber-600';
            else if (limit >= 70) bgColor = 'bg-purple-600';

            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="w-8 h-8 rounded-full ${bgColor} text-white flex items-center justify-center shadow-lg border-2 border-white font-bold text-xs">
                           <i class="fa-solid fa-camera"></i>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });
        }

        function renderCameras(data) {
            markersLayer.clearLayers();
            markersMap.clear();

            const listContainer = document.getElementById('cameras-list');
            listContainer.innerHTML = '';

            document.getElementById('result-count').textContent = `共找到 ${data.length} 處站點`;

            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-face-sad-tear text-3xl mb-2"></i>
                        <p class="text-sm">沒有找到符合條件的測速照相站點</p>
                    </div>
                `;
                return;
            }

            data.forEach(cam => {
                // 1. Create Marker
                const marker = L.marker([cam.lat, cam.lng], {
                    icon: createCameraIcon(cam.limit)
                });

                const popupContent = `
                    <div class="p-4 max-w-xs">
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="bg-red-100 text-red-700 font-semibold px-2 py-0.5 rounded text-xs">${cam.district}</span>
                            <span class="bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded text-xs">速限 ${cam.limit} km/h</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-sm mb-1">${cam.address}</h3>
                        <div class="text-xs text-slate-500 space-y-1 mt-2 border-t border-slate-100 pt-2">
                            <p><strong class="text-slate-700">設備型式：</strong>${cam.type}</p>
                            <p><strong class="text-slate-700">拍攝方向：</strong>${cam.direction}</p>
                        </div>
                    </div>
                `;
                marker.bindPopup(popupContent, { className: 'custom-popup' });
                markersLayer.addLayer(marker);
                markersMap.set(cam.id, marker);

                // 2. Create Sidebar Card
                const card = document.createElement('div');
                card.className = "bg-white hover:bg-slate-50 p-3 rounded-xl border border-slate-100 shadow-sm cursor-pointer transition group";
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-1">
                        <div class="flex items-center space-x-2">
                            <span class="bg-red-50 text-red-600 group-hover:bg-red-600 group-hover:text-white transition w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold">
                                <i class="fa-solid fa-camera"></i>
                            </span>
                            <span class="text-xs font-bold text-slate-500">${cam.district}</span>
                        </div>
                        <span class="bg-amber-50 text-amber-700 border border-amber-200 font-bold px-2 py-0.5 rounded text-xs">速限 ${cam.limit}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm mb-1 group-hover:text-red-600 transition">${cam.address}</h4>
                    <div class="flex items-center justify-between text-xs text-slate-400 mt-2">
                        <span>方向：${cam.direction}</span>
                        <span class="text-slate-500 font-medium">${cam.type}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    // Fly to location
                    map.flyTo([cam.lat, cam.lng], 17, {
                        duration: 1.2
                    });
                    marker.openPopup();

                    // On mobile, close sidebar on click
                    if (window.innerWidth < 1024) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });

                listContainer.appendChild(card);
            });
        }

        function filterCameras() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const selectedDistrict = document.getElementById('district-filter').value;

            const filtered = speedCamerasData.filter(cam => {
                const matchQuery = cam.address.toLowerCase().includes(query) || 
                                   cam.district.toLowerCase().includes(query) || 
                                   cam.type.toLowerCase().includes(query);
                const matchDistrict = selectedDistrict === "" || cam.district === selectedDistrict;
                return matchQuery && matchDistrict;
            });

            renderCameras(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterCameras);
        document.getElementById('district-filter').addEventListener('change', filterCameras);

        // Sidebar toggle for mobile
        const sidebar = document.getElementById('sidebar');
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });
        document.getElementById('close-sidebar').addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
        });

        // Reset view button
        document.getElementById('btn-reset-view').addEventListener('click', () => {
            map.flyTo(defaultCenter, defaultZoom, { duration: 1 });
        });

        // Initialize on window load
        window.onload = function() {
            initMap();
        };
    </script>
</body>
